<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030D40">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ponto Estágio · Ars Curandi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#030D40; --navy-2:#081655; --navy-3:#101F6B;
  --gold:#C9A24A; --gold-2:#EBD58E;
  --cream:#F9F9F9; --muted:#A9B2D6;
  --ok:#7CC49A; --erro:#F0A090;
  --linha:rgba(249,249,249,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  background:var(--navy);color:var(--cream);
  font-family:Lato,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.4;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold-2);outline-offset:2px}
h1{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:34px;line-height:1.1;margin:0}
.mono{font-family:"DM Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}

.tela{max-width:480px;margin:0 auto;padding:20px 20px 32px;min-height:100vh;display:flex;flex-direction:column}
.marca{display:flex;align-items:center;gap:10px;font-family:"DM Serif Display",Georgia,serif;color:var(--gold);font-size:20px;margin:0 0 16px}
.marca img{width:44px;height:44px;border-radius:50%}

#faixa{background:var(--erro);color:#3B1209;font-weight:700;padding:10px 16px;text-align:center;font-size:14px}

/* lista de pessoas */
#lista{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.pessoa{
  display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  min-height:88px;padding:14px 16px;border-radius:16px;
  background:var(--navy-2);border:1px solid var(--linha);border-left:5px solid var(--linha);
}
.pessoa:active{background:var(--navy-3)}
.pessoa.andamento{border-left-color:var(--gold)}
.pessoa.ok{border-left-color:var(--ok)}
.inicial{
  flex:none;width:52px;height:52px;border-radius:50%;
  background:var(--gold);color:var(--navy);
  display:grid;place-items:center;
  font-family:"DM Serif Display",Georgia,serif;font-size:26px;
}
.pessoa .nome{display:block;font-weight:900;font-size:20px}
.pessoa .status{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.pessoa.andamento .status{color:var(--gold-2)}
.pessoa.ok .status{color:var(--ok)}
.rodape{margin-top:auto;padding-top:32px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:12px 4px;min-height:48px;font-size:15px}

/* registro */
.voltar{align-self:flex-start;background:none;border:0;color:var(--gold-2);font-weight:700;font-size:17px;min-height:48px;padding:0 8px 0 0}
.data{color:var(--muted);margin:6px 0 0;text-transform:capitalize}
#relogio{font-size:64px;text-align:center;margin:28px 0 24px;letter-spacing:-1px}
.principal{
  width:100%;min-height:96px;border:0;border-radius:18px;
  background:var(--gold);color:var(--navy);
  font-weight:900;font-size:24px;
}
.principal:active{transform:scale(.98);background:var(--gold-2)}
.principal:disabled{opacity:.4;transform:none}
#concluido{
  border:1px solid var(--ok);border-radius:18px;padding:24px 16px;text-align:center;
  color:var(--ok);font-weight:900;font-size:20px;
}
.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px}
.resumo div{background:var(--navy-2);border:1px solid var(--linha);border-radius:14px;padding:12px 8px;text-align:center}
.resumo small{display:block;color:var(--muted);font-size:13px}
.resumo b{display:block;font-family:"DM Mono",ui-monospace,monospace;font-weight:500;font-size:24px;margin-top:2px}

/* sucesso */
#tela-sucesso{align-items:center;justify-content:center;text-align:center;gap:10px}
#tela-sucesso svg{width:96px;height:96px}
#suc-hora{font-size:56px;color:var(--gold-2)}
#suc-volta{color:var(--muted);font-size:15px;margin-top:16px}

/* folhas de confirmação */
.fundo{position:fixed;inset:0;background:rgba(1,5,30,.78);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.folha-sheet{
  width:100%;max-width:480px;background:var(--cream);color:var(--navy);
  border-radius:22px 22px 0 0;padding:26px 20px calc(24px + env(safe-area-inset-bottom));
}
.folha-sheet h2{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:28px;margin:0}
.folha-sheet p{margin:6px 0 20px;font-size:18px}
.folha-sheet .hora-conf{font-size:40px;display:block;margin:4px 0 20px}
.botoes{display:flex;flex-direction:column;gap:10px}
.btn-ok{min-height:60px;border:0;border-radius:14px;background:var(--navy);color:var(--cream);font-weight:900;font-size:19px}
.btn-sec{min-height:52px;border:1px solid rgba(3,13,64,.35);border-radius:14px;background:transparent;color:var(--navy);font-weight:700;font-size:17px}
.btn-ok:disabled{opacity:.5}
#pin{width:100%;min-height:60px;border-radius:14px;border:2px solid var(--navy);background:#fff;color:var(--navy);text-align:center;font-size:28px;letter-spacing:8px;margin-bottom:12px}
#pin-erro{color:#A3301C;font-weight:700;margin:-4px 0 12px;font-size:15px}

/* relatório */
.campos{display:grid;gap:12px;margin:20px 0}
.campos label{display:block;color:var(--muted);font-size:14px;margin-bottom:4px}
.campos input,.campos select{
  width:100%;min-height:52px;border-radius:12px;border:1px solid var(--linha);
  background:var(--navy-2);padding:0 12px;color-scheme:dark;
}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.acoes button{min-height:54px;border-radius:14px;border:0;font-weight:900;font-size:17px}
#btn-gerar{background:var(--gold);color:var(--navy)}
#btn-imprimir{background:transparent;border:1px solid var(--gold)!important;color:var(--gold-2)}
#btn-imprimir:disabled{opacity:.4}
#msg-rel{color:var(--muted);margin:0 0 16px}

.folha{background:#fff;color:#111;border-radius:6px;padding:16px;margin-bottom:20px;font-family:Lato,system-ui,sans-serif}
.folha h3{margin:0;font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:20px}
.folha .sub{margin:2px 0 10px;font-size:13px;color:#444}
.folha table{width:100%;border-collapse:collapse;font-size:12px}
.folha th,.folha td{border:1px solid #888;padding:3px 6px;text-align:center}
.folha th{background:#efe6cb}
.folha td.dia{text-align:left;white-space:nowrap}
.folha tr.fim td{background:#efefef}
.folha tfoot td{font-weight:700;background:#efe6cb}
.assin{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:34px;font-size:12px}
.assin div{border-top:1px solid #111;padding-top:4px;text-align:center}

@media (prefers-reduced-motion:no-preference){
  #tela-sucesso svg path{stroke-dasharray:60;stroke-dashoffset:60;animation:tick .5s .1s ease-out forwards}
  @keyframes tick{to{stroke-dashoffset:0}}
}

.btn-perigo{background:#A3301C}
.btn-apagar{min-height:36px;padding:0 10px;border:1px solid #A3301C;border-radius:8px;background:#fff;color:#A3301C;font-weight:700;font-size:12px}
.aviso-apg{font-size:14px;color:#5b5b5b;margin:0 0 16px}

@page{size:A4;margin:12mm}
@media print{
  body{background:#fff;color:#000;padding:0}
  #faixa,.tela:not(#tela-relatorio),.fundo,.nao-imprimir{display:none!important}
  #tela-relatorio{display:block!important;max-width:none;padding:0;min-height:0}
  .folha{border-radius:0;padding:0;margin:0;page-break-after:always;break-after:page}
  .folha:last-child{page-break-after:auto;break-after:auto}
  .folha th,.folha td{padding:2px 5px}
}
</style>
</head>
<body>

<div id="faixa" role="status" aria-live="polite" hidden></div>

<!-- 1. Quem vai registrar -->
<main class="tela" id="tela-lista">
  <div class="marca"><img src="icon-192.png" alt="" width="44" height="44">Ars Curandi</div>
  <h1>Quem vai registrar?</h1>
  <div id="lista"></div>
  <div class="rodape">
    <button class="link" id="link-relatorio" type="button">Relatório mensal</button>
  </div>
</main>

<!-- 2. Registro da pessoa -->
<main class="tela" id="tela-registro" hidden>
  <button class="voltar" id="btn-voltar" type="button">‹ Trocar pessoa</button>
  <h1 id="reg-nome"></h1>
  <p class="data" id="reg-data"></p>
  <div id="relogio" class="mono" aria-label="Hora atual">--:--:--</div>
  <button class="principal" id="btn-registrar" type="button">Carregando…</button>
  <div id="concluido" hidden>Jornada de hoje concluída</div>
  <div class="resumo">
    <div><small>Entrada</small><b id="reg-entrada">--:--</b></div>
    <div><small>Saída</small><b id="reg-saida">--:--</b></div>
    <div><small>Total</small><b id="reg-total">--:--</b></div>
  </div>
</main>

<!-- 3. Confirmação de registro feito -->
<main class="tela" id="tela-sucesso" hidden>
  <svg viewBox="0 0 96 96" fill="none" aria-hidden="true">
    <circle cx="48" cy="48" r="44" stroke="#7CC49A" stroke-width="4"/>
    <path d="M28 49l14 14 27-30" stroke="#7CC49A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1 id="suc-titulo"></h1>
  <div id="suc-nome" style="font-size:20px"></div>
  <div id="suc-hora" class="mono"></div>
  <button class="link" id="suc-volta" type="button"></button>
</main>

<!-- 4. Relatório (com PIN) -->
<main class="tela" id="tela-relatorio" hidden>
  <div class="nao-imprimir">
    <button class="voltar" id="rel-voltar" type="button">‹ Voltar</button>
    <h1>Relatório mensal</h1>
    <div class="campos">
      <div><label for="mes">Mês</label><input type="month" id="mes"></div>
      <div><label for="quem">Estagiário</label><select id="quem"></select></div>
    </div>
    <div class="acoes">
      <button id="btn-gerar" type="button">Gerar</button>
      <button id="btn-imprimir" type="button" disabled>Imprimir / PDF</button>
    </div>
    <p id="msg-rel"></p>
  </div>
  <div id="folhas"></div>
</main>

<!-- Confirmar registro -->
<div class="fundo" id="conf" hidden>
  <div class="folha-sheet" role="dialog" aria-modal="true" aria-labelledby="conf-titulo">
    <h2 id="conf-titulo"></h2>
    <p id="conf-nome"></p>
    <span class="hora-conf mono" id="conf-hora"></span>
    <div class="botoes">
      <button class="btn-ok" id="conf-ok" type="button">Confirmar</button>
      <button class="btn-sec" id="conf-cancelar" type="button">Cancelar</button>
    </div>
  </div>
</div>

<!-- Apagar registro (só no relatório, após o PIN) -->
<div class="fundo" id="apagar" hidden>
  <div class="folha-sheet" role="dialog" aria-modal="true" aria-labelledby="apg-titulo">
    <h2 id="apg-titulo">Apagar registro</h2>
    <p id="apg-quem" style="margin-bottom:4px"></p>
    <span class="mono" id="apg-horas" style="display:block;font-size:20px;margin-bottom:8px"></span>
    <p class="aviso-apg">Não dá para desfazer. Depois de apagar, a pessoa pode registrar de novo.</p>
    <div class="botoes">
      <button class="btn-ok btn-perigo" id="apg-dia" type="button"></button>
      <button class="btn-sec" id="apg-saida" type="button">Apagar só a saída</button>
      <button class="btn-sec" id="apg-cancelar" type="button">Cancelar</button>
    </div>
  </div>
</div>

<!-- PIN do relatório -->
<div class="fundo" id="pin-sheet" hidden>
  <div class="folha-sheet" role="dialog" aria-modal="true" aria-labelledby="pin-titulo">
    <h2 id="pin-titulo">Digite o PIN</h2>
    <p>Acesso do responsável ao relatório.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN">
    <div id="pin-erro" hidden>PIN incorreto.</div>
    <div class="botoes">
      <button class="btn-ok" id="pin-ok" type="button">Entrar</button>
      <button class="btn-sec" id="pin-cancelar" type="button">Cancelar</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
/* =====================  CONFIGURAÇÃO  ===================== */
// Cole aqui a configuração do projeto Firebase (Configurações do projeto > Seus apps > Web)
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCyFSeLRdjQneBtLRmGHh00hsthJBJh4OM",
  authDomain: "ars-curandi-compras.firebaseapp.com",
  databaseURL: "https://ars-curandi-compras-default-rtdb.firebaseio.com",
  projectId: "ars-curandi-compras",
  storageBucket: "ars-curandi-compras.firebasestorage.app",
  messagingSenderId: "450597983580",
  appId: "1:450597983580:web:93bbc3cabd44f15e6b1d99"
};

// O "id" nunca muda (é a chave no banco). Só o "nome" pode ser alterado.
const ESTAGIARIOS = [
  { id: "est3", nome: "Rhayssa" }
];

const PIN_ADMIN = "6933";          // troque por um PIN seu
const RAIZ = "ponto_estagiarios";  // nó no Realtime Database
const TZ = "America/Sao_Paulo";
/* ========================================================== */

const $ = s => document.querySelector(s);
const fmtDia = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
const fmtHora = new Intl.DateTimeFormat("pt-BR", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
const fmtHoraSeg = new Intl.DateTimeFormat("pt-BR", { timeZone: TZ, hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
const fmtExtenso = new Intl.DateTimeFormat("pt-BR", { timeZone: TZ, weekday: "long", day: "numeric", month: "long" });
const SEMANA = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

let db = null, online = false, offset = 0;
let pessoa = null, tipoPendente = null, gravando = false, voltaTimer = null;
let dadosHoje = {}, ouvintes = [], diaAtual = "";
let ultimoRelatorio = false;
let relDados = {}, apagando = null;

const agora = () => Date.now() + offset;         // hora corrigida pelo servidor
const diaDe = ts => fmtDia.format(new Date(ts));
const hora = ts => fmtHora.format(new Date(ts));
const durMin = min => Math.floor(min / 60) + ":" + String(min % 60).padStart(2, "0");
const dur = ms => durMin(Math.round(ms / 60000));

function ir(id) {
  document.querySelectorAll(".tela").forEach(t => t.hidden = (t.id !== id));
  window.scrollTo(0, 0);
}
function faixa(msg) {
  const f = $("#faixa");
  f.textContent = msg || "";
  f.hidden = !msg;
}

/* ---------- lista de pessoas ---------- */
function renderLista() {
  $("#lista").innerHTML = ESTAGIARIOS.map(p => {
    const d = dadosHoje[p.id];
    let st = "Carregando…", cls = "";
    if (d !== undefined) {
      if (d.entrada && d.saida) { st = "Hoje: " + hora(d.entrada) + " às " + hora(d.saida); cls = "ok"; }
      else if (d.entrada) { st = "Entrada às " + hora(d.entrada); cls = "andamento"; }
      else st = "Sem registro hoje";
    }
    return '<button type="button" class="pessoa ' + cls + '" data-id="' + p.id + '">' +
      '<span class="inicial">' + p.nome.charAt(0).toUpperCase() + '</span>' +
      '<span><span class="nome">' + p.nome + '</span><span class="status">' + st + '</span></span></button>';
  }).join("");
}
$("#lista").addEventListener("click", e => {
  const b = e.target.closest(".pessoa");
  if (!b) return;
  pessoa = ESTAGIARIOS.find(p => p.id === b.dataset.id);
  renderRegistro();
  ir("tela-registro");
});

/* ---------- tela de registro ---------- */
function renderRegistro() {
  if (!pessoa) return;
  const d = dadosHoje[pessoa.id];
  const e = d && d.entrada, s = d && d.saida;
  const btn = $("#btn-registrar");
  $("#reg-nome").textContent = pessoa.nome;
  $("#reg-data").textContent = fmtExtenso.format(new Date(agora()));
  $("#reg-entrada").textContent = e ? hora(e) : "--:--";
  $("#reg-saida").textContent = s ? hora(s) : "--:--";
  $("#reg-total").textContent = (e && s) ? dur(s - e) : "--:--";
  btn.hidden = !!(e && s);
  $("#concluido").hidden = !(e && s);
  if (d === undefined) { btn.textContent = "Carregando…"; btn.disabled = true; btn.dataset.tipo = ""; }
  else if (!e) { btn.textContent = "Registrar entrada"; btn.dataset.tipo = "entrada"; btn.disabled = !online; }
  else if (!s) { btn.textContent = "Registrar saída"; btn.dataset.tipo = "saida"; btn.disabled = !online; }
}
$("#btn-voltar").onclick = () => { pessoa = null; ir("tela-lista"); };

$("#btn-registrar").onclick = () => {
  const tipo = $("#btn-registrar").dataset.tipo;
  if (!tipo || !online) return;
  tipoPendente = tipo;
  $("#conf-titulo").textContent = "Registrar " + (tipo === "entrada" ? "entrada" : "saída") + "?";
  $("#conf-nome").textContent = pessoa.nome;
  $("#conf-hora").textContent = hora(agora());
  $("#conf-ok").disabled = false;
  $("#conf").hidden = false;
};
$("#conf-cancelar").onclick = () => { $("#conf").hidden = true; tipoPendente = null; };

$("#conf-ok").onclick = () => {
  if (!tipoPendente || gravando || !db) return;
  gravando = true;
  $("#conf-ok").disabled = true;
  const tipo = tipoPendente, p = pessoa, ts = agora();
  const ref = db.ref(RAIZ + "/registros/" + p.id + "/" + diaDe(ts) + "/" + tipo);
  ref.transaction(atual => (atual === null ? ts : undefined), (err, committed) => {
    gravando = false;
    $("#conf").hidden = true;
    tipoPendente = null;
    if (err) { faixa("Não foi possível gravar. Avise o responsável."); setTimeout(() => faixa(""), 6000); return; }
    if (!committed) { faixa("Esse registro já existe."); setTimeout(() => faixa(""), 5000); return; }
    mostrarSucesso(p, tipo, ts);
  }, false);
};

/* ---------- sucesso ---------- */
function mostrarSucesso(p, tipo, ts) {
  $("#suc-titulo").textContent = (tipo === "entrada" ? "Entrada" : "Saída") + " registrada";
  $("#suc-nome").textContent = p.nome;
  $("#suc-hora").textContent = hora(ts);
  ir("tela-sucesso");
  let seg = 5;
  const atualiza = () => { $("#suc-volta").textContent = "Voltando em " + seg + "s (toque para voltar)"; };
  atualiza();
  clearInterval(voltaTimer);
  voltaTimer = setInterval(() => {
    seg--;
    if (seg <= 0) voltar(); else atualiza();
  }, 1000);
}
function voltar() {
  clearInterval(voltaTimer);
  pessoa = null;
  ir("tela-lista");
}
$("#suc-volta").onclick = voltar;
$("#tela-sucesso").addEventListener("click", voltar);

/* ---------- relógio ---------- */
function tick() {
  const t = fmtHoraSeg.format(new Date(agora()));
  $("#relogio").textContent = t;
  if (!$("#conf").hidden) $("#conf-hora").textContent = t.slice(0, 5);
  if (db && diaDe(agora()) !== diaAtual) ouvirHoje();   // virou o dia
}
setInterval(tick, 1000);

/* ---------- Firebase ---------- */
function ouvirHoje() {
  ouvintes.forEach(o => o.ref.off("value", o.fn));
  ouvintes = [];
  dadosHoje = {};
  diaAtual = diaDe(agora());
  ESTAGIARIOS.forEach(p => {
    const ref = db.ref(RAIZ + "/registros/" + p.id + "/" + diaAtual);
    const fn = snap => {
      dadosHoje[p.id] = snap.val() || {};
      renderLista();
      if (pessoa && pessoa.id === p.id) renderRegistro();
    };
    ref.on("value", fn);
    ouvintes.push({ ref, fn });
  });
  renderLista();
}

function iniciar() {
  renderLista();
  if (typeof firebase === "undefined") { faixa("Sem conexão com a internet. Conecte o celular e reabra o app."); return; }
  if (String(FIREBASE_CONFIG.apiKey).indexOf("COLE") === 0) { faixa("Falta colar a configuração do Firebase no arquivo index.html."); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  firebase.auth().onAuthStateChanged(u => {
    if (!u || db) return;
    db = firebase.database();
    db.ref(".info/serverTimeOffset").on("value", s => { offset = s.val() || 0; });
    db.ref(".info/connected").on("value", s => {
      online = !!s.val();
      faixa(online ? "" : "Sem conexão. Só é possível registrar com internet.");
      renderRegistro();
    });
    ouvirHoje();
  });
  firebase.auth().signInAnonymously().catch(() => faixa("Não foi possível conectar. Avise o responsável."));
}

/* ---------- relatório ---------- */
$("#link-relatorio").onclick = () => {
  $("#pin").value = ""; $("#pin-erro").hidden = true;
  $("#pin-sheet").hidden = false;
  setTimeout(() => $("#pin").focus(), 50);
};
$("#pin-cancelar").onclick = () => { $("#pin-sheet").hidden = true; };
function validarPin() {
  if ($("#pin").value === PIN_ADMIN) {
    $("#pin-sheet").hidden = true;
    abrirRelatorio();
  } else {
    $("#pin-erro").hidden = false;
    $("#pin").value = "";
  }
}
$("#pin-ok").onclick = validarPin;
$("#pin").addEventListener("keydown", e => { if (e.key === "Enter") validarPin(); });

function abrirRelatorio() {
  $("#mes").value = diaDe(agora()).slice(0, 7);
  $("#quem").innerHTML = '<option value="todos">Todos</option>' +
    ESTAGIARIOS.map(p => '<option value="' + p.id + '">' + p.nome + '</option>').join("");
  $("#folhas").innerHTML = "";
  $("#msg-rel").textContent = "";
  $("#btn-imprimir").disabled = true;
  ir("tela-relatorio");
}
$("#rel-voltar").onclick = () => ir("tela-lista");

$("#btn-gerar").onclick = async () => {
  if (!db || !online) { $("#msg-rel").textContent = "Sem conexão. Conecte-se para gerar o relatório."; return; }
  const mes = $("#mes").value;
  if (!mes) { $("#msg-rel").textContent = "Escolha o mês."; return; }
  const [a, m] = mes.split("-").map(Number);
  const ultimo = new Date(Date.UTC(a, m, 0)).getUTCDate();
  const sel = $("#quem").value;
  const lista = sel === "todos" ? ESTAGIARIOS : ESTAGIARIOS.filter(p => p.id === sel);
  $("#msg-rel").textContent = "Buscando registros…";
  $("#btn-imprimir").disabled = true;
  try {
    const snaps = await Promise.all(lista.map(p =>
      db.ref(RAIZ + "/registros/" + p.id).orderByKey().startAt(mes + "-01").endAt(mes + "-" + String(ultimo).padStart(2, "0")).once("value")));
    relDados = {};
    lista.forEach((p, i) => { relDados[p.id] = snaps[i].val() || {}; });
    $("#folhas").innerHTML = lista.map((p, i) => folha(p, a, m, ultimo, snaps[i].val() || {})).join("");
    $("#msg-rel").textContent = "";
    $("#btn-imprimir").disabled = false;
  } catch (e) {
    $("#msg-rel").textContent = "Não foi possível buscar os registros.";
  }
};

function folha(p, a, m, ultimo, dados) {
  let total = 0, dias = 0, linhas = "";
  for (let d = 1; d <= ultimo; d++) {
    const chave = a + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    const dow = new Date(Date.UTC(a, m - 1, d)).getUTCDay();
    const r = dados[chave] || {};
    let t = "";
    if (r.entrada && r.saida) {
      const min = Math.round((r.saida - r.entrada) / 60000);
      total += min; dias++; t = durMin(min);
    } else if (r.entrada) t = "sem saída";
    linhas += '<tr class="' + ((dow === 0 || dow === 6) ? "fim" : "") + '">' +
      '<td class="dia">' + String(d).padStart(2, "0") + " " + SEMANA[dow] + "</td>" +
      "<td>" + (r.entrada ? hora(r.entrada) : "") + "</td>" +
      "<td>" + (r.saida ? hora(r.saida) : "") + "</td>" +
      "<td>" + t + "</td>" +
      '<td class="nao-imprimir">' + ((r.entrada || r.saida) ? '<button type="button" class="btn-apagar" data-p="' + p.id + '" data-dia="' + chave + '">Apagar</button>' : "") + "</td></tr>";
  }
  return '<section class="folha"><h3>Ars Curandi · Registro de jornada de estágio</h3>' +
    '<div class="sub"><b>' + p.nome + "</b> — " + MESES[m - 1] + " de " + a + "</div>" +
    "<table><thead><tr><th>Dia</th><th>Entrada</th><th>Saída</th><th>Total</th><th class='nao-imprimir'></th></tr></thead><tbody>" + linhas +
    '</tbody><tfoot><tr><td class="dia" colspan="3">Total do mês (' + dias + " dias com jornada completa)</td><td>" + durMin(total) + '</td><td class="nao-imprimir"></td></tr></tfoot></table>' +
    '<div class="assin"><div>Estagiário</div><div>Responsável</div></div></section>';
}

$("#folhas").addEventListener("click", e => {
  const b = e.target.closest(".btn-apagar");
  if (!b) return;
  const pe = ESTAGIARIOS.find(x => x.id === b.dataset.p);
  const dia = b.dataset.dia;
  const r = (relDados[pe.id] || {})[dia] || {};
  apagando = { p: pe, dia };
  const [a, m, d] = dia.split("-");
  $("#apg-quem").textContent = pe.nome + " — " + d + "/" + m + "/" + a;
  $("#apg-horas").textContent = "Entrada " + (r.entrada ? hora(r.entrada) : "--:--") + " · Saída " + (r.saida ? hora(r.saida) : "--:--");
  $("#apg-dia").textContent = (r.entrada && r.saida) ? "Apagar o dia inteiro" : "Apagar este registro";
  $("#apg-saida").hidden = !(r.entrada && r.saida);
  $("#apg-dia").disabled = false;
  $("#apg-saida").disabled = false;
  $("#apagar").hidden = false;
});
$("#apg-cancelar").onclick = () => { $("#apagar").hidden = true; apagando = null; };
function executarApagar(soSaida) {
  if (!apagando || !db) return;
  if (!online) { $("#apagar").hidden = true; apagando = null; $("#msg-rel").textContent = "Sem conexão. Conecte-se para apagar."; return; }
  const { p, dia } = apagando;
  $("#apg-dia").disabled = true;
  $("#apg-saida").disabled = true;
  db.ref(RAIZ + "/registros/" + p.id + "/" + dia + (soSaida ? "/saida" : "")).remove()
    .then(() => { $("#apagar").hidden = true; apagando = null; $("#btn-gerar").click(); })
    .catch(() => { $("#apagar").hidden = true; apagando = null; $("#msg-rel").textContent = "Não foi possível apagar."; });
}
$("#apg-dia").onclick = () => executarApagar(false);
$("#apg-saida").onclick = () => executarApagar(true);

$("#btn-imprimir").onclick = () => {
  const antes = document.title;
  const nome = $("#quem").value === "todos" ? "todos" : $("#quem").selectedOptions[0].textContent;
  document.title = "Ponto estagio - " + nome + " - " + $("#mes").value;
  window.print();
  setTimeout(() => { document.title = antes; }, 1000);
};

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
iniciar();
tick();
</script>
