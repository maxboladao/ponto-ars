<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fundo preto com cantos arredondados -->
  <rect width="512" height="512" rx="112" fill="#000000"/>
  <!-- Área segura maskable: conteúdo dentro dos 80% centrais -->
  <!-- Círculo do relógio -->
  <circle cx="256" cy="240" r="120" fill="none" stroke="#30d158" stroke-width="22"/>
  <!-- Ponteiro das horas -->
  <line x1="256" y1="240" x2="256" y2="160" stroke="#30d158" stroke-width="22" stroke-linecap="round"/>
  <!-- Ponteiro dos minutos -->
  <line x1="256" y1="240" x2="316" y2="276" stroke="#30d158" stroke-width="22" stroke-linecap="round"/>
  <!-- Ponto central -->
  <circle cx="256" cy="240" r="10" fill="#30d158"/>
  <!-- Texto "Ponto" embaixo -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, Helvetica Neue, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1">Ponto</text>
</svg>
